<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jishnu Store 2.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#172033}
header{background:#111827;color:#fff;position:sticky;top:0;z-index:5}.wrap{max-width:1100px;margin:auto;padding:0 15px}
.top{min-height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:800}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.dark{background:#111827;color:white}.light{background:#eef2f7;color:#172033}.red{background:#dc2626;color:white}.green{background:#079455;color:white}
.hero{padding:28px 0 12px}.hero h1{font-size:30px;margin:6px 0}.muted{color:#667085}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}.cat{white-space:nowrap;background:#fff;border:1px solid #ddd}.cat.active{background:#111827;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-bottom:90px}.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb}
.cover{height:205px;background:#eef1f5;display:flex;align-items:center;justify-content:center;cursor:pointer}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.body h3{margin:6px 0}.price{font-size:21px;font-weight:800}.old{text-decoration:line-through;color:#98a2b3;margin-left:6px}.off{font-size:12px;color:#067647;background:#ecfdf3;padding:4px;border-radius:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.fab{position:fixed;right:16px;bottom:16px;background:#111827;color:white;border:0;border-radius:30px;padding:15px 20px;z-index:10}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;overflow:auto;padding:15px}.box{max-width:820px;margin:20px auto;background:#fff;border-radius:18px;padding:20px}.close{float:right}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px}
.gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.gallery img{width:100%;height:65px;object-fit:cover;border-radius:8px}.mainphoto{height:330px;background:#f0f2f5;border-radius:12px;display:flex;align-items:center;justify-content:center}.mainphoto img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.order{border:1px solid #e4e7ec;border-radius:12px;padding:12px;margin:10px 0}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.nav button{white-space:nowrap}
@media(max-width:600px){.row{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style></head><body>
<header><div class="wrap top"><div class="brand" id="shopName">Jishnu Store</div><button class="light" onclick="openCart()">🛒 <span id="ccount">0</span></button></div></header>
<main class="wrap"><section class="hero"><div class="muted">Local Online Shopping</div><h1 id="title">Everything You Need, Near You</h1><p id="sub">Quality products • Affordable prices • Local COD delivery</p>
<input id="search" class="search" placeholder="🔎 Search products..." oninput="render()"><div id="cats" class="cats"></div></section><div id="products" class="grid"></div></main>
<button class="fab" onclick="openCart()">🛒 Cart</button>

<div id="pmodal" class="modal"><div class="box"><button class="light close" onclick="closeM('pmodal')">✕</button><div id="pdetail"></div></div></div>
<div id="cmodal" class="modal"><div class="box"><button class="light close" onclick="closeM('cmodal')">✕</button><h2>🛒 Cart</h2><div id="cart"></div><h3>Total: ₹<span id="total">0</span></h3><div id="checkout"></div></div></div>
<div id="amodal" class="modal"><div class="box" id="abox"></div></div>

<script>
const KEY='jishnu_store_2_db';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{settings:{name:'Jishnu Store',title:'Everything You Need, Near You',sub:'Quality products • Affordable prices • Local COD delivery',wa:'919999999999'},password:'Jishnu@123',products:[
{id:1,name:'Premium Highlighter Set',price:99,mrp:129,cat:'Stationery',stock:20,desc:'Useful highlighter set.',imgs:[]},
{id:2,name:'Study Pen Pack',price:129,mrp:159,cat:'Stationery',stock:30,desc:'Smooth writing pens.',imgs:[]},
{id:3,name:'Mobile Charging Cable',price:199,mrp:249,cat:'Electronics',stock:15,desc:'Daily-use charging cable.',imgs:[]},
{id:4,name:'Water Bottle',price:249,mrp:299,cat:'Home',stock:12,desc:'Reusable bottle.',imgs:[]}],orders:[],coupons:[{code:'WELCOME10',value:10}]};
let cartItems=[],cat='All',tempImgs=[],viewId=null,viewPhoto=0;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function init(){shopName.textContent=db.settings.name;title.textContent=db.settings.title;sub.textContent=db.settings.sub;render()}
function render(){
let q=search.value.toLowerCase(), cs=['All',...new Set(db.products.map(p=>p.cat).filter(Boolean))];
cats.innerHTML=cs.map(x=>`<button class="cat ${x===cat?'active':''}" onclick="setCat('${esc(x)}')">${esc(x)}</button>`).join('');
let ps=db.products.filter(p=>(cat==='All'||p.cat===cat)&&(!q||p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)));
products.innerHTML=ps.map(p=>{let img=p.imgs?.[0]||'',off=p.mrp>p.price?Math.round((1-p.price/p.mrp)*100):0;return `<div class="card"><div class="cover" onclick="view(${p.id})">${img?`<img src="${img}">`:'🛍️'}</div><div class="body"><div class="muted">${esc(p.cat)}</div><h3>${esc(p.name)}</h3><span class="price">₹${p.price}</span>${p.mrp>p.price?` <span class="old">₹${p.mrp}</span> <span class="off">${off}% OFF</span>`:''}<div class="muted">${p.stock>0?'In stock':'Out of stock'}</div><div class="actions"><button class="dark" onclick="add(${p.id})" ${p.stock<1?'disabled':''}>Add to Cart</button><button class="light" onclick="view(${p.id})">View</button></div></div></div>`}).join('')||'<p>No products found.</p>';updateCount()}
function setCat(x){cat=x;render()}
function add(id){let p=db.products.find(x=>x.id===id);if(!p||p.stock<1)return;let i=cartItems.find(x=>x.id===id);if(i){if(i.qty<p.stock)i.qty++}else cartItems.push({id,qty:1});updateCount()}
function updateCount(){ccount.textContent=cartItems.reduce((a,b)=>a+b.qty,0)}
function openCart(){drawCart();cmodal.style.display='block'}
function closeM(x){document.getElementById(x).style.display='none'}
function view(id){let p=db.products.find(x=>x.id===id);if(!p)return;viewId=id;viewPhoto=0;drawProduct(p);pmodal.style.display='block'}
function drawProduct(p){let imgs=p.imgs||[],src=imgs[viewPhoto]||'';pdetail.innerHTML=`<div class="mainphoto">${src?`<img src="${src}">`:'🛍️'}</div>${imgs.length?`<div class="gallery">${imgs.map((x,i)=>`<img src="${x}" onclick="viewPhoto=${i};drawProduct(db.products.find(p=>p.id===viewId))">`).join('')}</div>`:''}<h2>${esc(p.name)}</h2><div class="muted">${esc(p.cat)}</div><h2>₹${p.price} ${p.mrp>p.price?`<span class="old">₹${p.mrp}</span>`:''}</h2><p>${esc(p.desc)}</p><p>${p.stock>0?'Available stock: '+p.stock:'Out of stock'}</p><button class="dark" onclick="add(${p.id})">🛒 Add to Cart</button>`}
function drawCart(){let sum=0;cart.innerHTML=cartItems.map(i=>{let p=db.products.find(x=>x.id===i.id);if(!p)return'';sum+=p.price*i.qty;return `<div class="order"><b>${esc(p.name)}</b><br>₹${p.price} × ${i.qty}<div class="actions"><button class="light" onclick="qty(${p.id},-1)">−</button><button class="light">${i.qty}</button><button class="light" onclick="qty(${p.id},1)">+</button><button class="red" onclick="rem(${p.id})">Remove</button></div></div>`}).join('')||'<p>Cart empty.</p>';total.textContent=sum;checkout.innerHTML=cartItems.length?`<h3>COD Checkout</h3><div class="row"><div class="field"><label>Name</label><input id="nm"></div><div class="field"><label>Phone</label><input id="ph"></div></div><div class="field"><label>Address</label><textarea id="ad" rows="3"></textarea></div><div class="field"><label>Coupon</label><input id="coupon" placeholder="WELCOME10"></div><button class="green" onclick="placeOrder()">Place COD Order</button>`:''}
function qty(id,n){let i=cartItems.find(x=>x.id===id),p=db.products.find(x=>x.id===id);if(!i)return;i.qty+=n;if(i.qty>p.stock)i.qty=p.stock;if(i.qty<1)cartItems=cartItems.filter(x=>x.id!==id);updateCount();drawCart()}
function rem(id){cartItems=cartItems.filter(x=>x.id!==id);updateCount();drawCart()}
function placeOrder(){let name=nm.value.trim(),phone=ph.value.trim(),address=ad.value.trim();if(!name||!phone||!address)return alert('Please fill all details.');let subtotal=cartItems.reduce((s,i)=>s+db.products.find(p=>p.id===i.id).price*i.qty,0),c=db.coupons.find(x=>x.code===(coupon.value||'').trim().toUpperCase()),discount=c?Math.round(subtotal*c.value/100):0,total=subtotal-discount,id='JS'+Date.now().toString().slice(-7);let lines=cartItems.map(i=>{let p=db.products.find(p=>p.id===i.id);return p.name+' x'+i.qty+' = ₹'+p.price*i.qty}).join('\\n');db.orders.unshift({id,name,phone,address,total,status:'New',date:new Date().toLocaleString(),items:cartItems.map(x=>({...x}))});cartItems.forEach(i=>{let p=db.products.find(x=>x.id===i.id);p.stock=Math.max(0,p.stock-i.qty)});save();window.open('https://wa.me/'+db.settings.wa+'?text='+encodeURIComponent('New COD Order\\nOrder: '+id+'\\nName: '+name+'\\nPhone: '+phone+'\\nAddress: '+address+'\\n\\n'+lines+'\\n\\nTotal: ₹'+total),'_blank');cartItems=[];updateCount();closeM('cmodal');render();alert('Order placed: '+id)}
function adminStart(){if(new URLSearchParams(location.search).get('admin')!=='1')return;let p=prompt('Admin Password');if(p===db.password)admin();else alert('Wrong password')}
function admin(){amodal.style.display='block';abox.innerHTML=`<button class="light close" onclick="closeM('amodal')">✕</button><h2>⚙️ Admin Dashboard</h2><div class="nav"><button class="dark" onclick="productsAdmin()">📦 Products</button><button class="dark" onclick="ordersAdmin()">🧾 Orders</button><button class="dark" onclick="shopAdmin()">🏪 Shop</button><button class="dark" onclick="couponAdmin()">🏷️ Coupons</button><button class="light" onclick="passAdmin()">🔐 Password</button></div><hr><div id="ac"></div>`;productsAdmin()}
function productsAdmin(){ac.innerHTML=`<h3>Products</h3><button class="dark" onclick="editProduct()">＋ Add Product</button>`+db.products.map(p=>`<div class="order"><b>${esc(p.name)}</b><br>₹${p.price} • MRP ₹${p.mrp} • ${esc(p.cat)} • Stock ${p.stock}<br>${p.imgs?.length||0} photos<div class="actions"><button class="light" onclick="editProduct(${p.id})">Edit</button><button class="red" onclick="delProduct(${p.id})">Delete</button></div></div>`).join('')}
function editProduct(id){let p=db.products.find(x=>x.id===id)||{id:Date.now(),name:'',price:0,mrp:0,cat:'General',stock:1,desc:'',imgs:[]};tempImgs=[...(p.imgs||[])];ac.innerHTML=`<h3>${id?'Edit':'Add'} Product</h3><div class="field"><label>Name</label><input id="pn" value="${esc(p.name)}"></div><div class="row"><div class="field"><label>Price ₹</label><input id="pp" type="number" value="${p.price}"></div><div class="field"><label>MRP ₹</label><input id="pm" type="number" value="${p.mrp}"></div></div><div class="row"><div class="field"><label>Stock</label><input id="ps" type="number" value="${p.stock}"></div><div class="field"><label>Category</label><input id="pc" value="${esc(p.cat)}"></div></div><div class="field"><label>Description</label><textarea id="pd">${esc(p.desc)}</textarea></div><div class="field"><label>Product Photos — select multiple</label><input id="files" type="file" accept="image/*" multiple onchange="loadFiles(this)"><div id="prev" class="gallery"></div></div><div class="actions"><button class="dark" onclick="saveProduct(${id||0})">Save</button><button class="light" onclick="productsAdmin()">Cancel</button></div>`;showPrev()}
function showPrev(){prev.innerHTML=tempImgs.map((x,i)=>`<div><img src="${x}"><button class="red" onclick="tempImgs.splice(${i},1);showPrev()">×</button></div>`).join('')}
function loadFiles(input){[...input.files].forEach(f=>{let r=new FileReader();r.onload=()=>{tempImgs.push(r.result);showPrev()};r.readAsDataURL(f)})}
function saveProduct(id){let p={id:id||Date.now(),name:pn.value.trim(),price:Number(pp.value),mrp:Number(pm.value),stock:Number(ps.value),cat:pc.value.trim()||'General',desc:pd.value.trim(),imgs:tempImgs};if(!p.name)return alert('Product name required');let i=db.products.findIndex(x=>x.id===p.id);if(i>=0)db.products[i]=p;else db.products.unshift(p);save();render();productsAdmin()}
function delProduct(id){if(confirm('Delete product?')){db.products=db.products.filter(p=>p.id!==id);save();render();productsAdmin()}}
function ordersAdmin(){ac.innerHTML='<h3>Orders</h3>'+ (db.orders.map(o=>`<div class="order"><b>${o.id}</b> • ${o.date}<br>${esc(o.name)} • ${esc(o.phone)}<br>${esc(o.address)}<br><b>Total ₹${o.total}</b><br><select onchange="setStatus('${o.id}',this.value)"><option ${o.status==='New'?'selected':''}>New</option><option ${o.status==='Packed'?'selected':''}>Packed</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></div>`).join('')||'<p>No orders.</p>')}
function setStatus(id,s){let o=db.orders.find(x=>x.id===id);if(o){o.status=s;save()}}
function shopAdmin(){ac.innerHTML=`<h3>Shop Settings</h3><div class="field"><label>Shop Name</label><input id="sn" value="${esc(db.settings.name)}"></div><div class="field"><label>Heading</label><input id="st" value="${esc(db.settings.title)}"></div><div class="field"><label>Description</label><input id="ss" value="${esc(db.settings.sub)}"></div><div class="field"><label>WhatsApp Number with country code</label><input id="sw" value="${esc(db.settings.wa)}"></div><button class="dark" onclick="saveShop()">Save Settings</button>`}
function saveShop(){db.settings={name:sn.value||'Jishnu Store',title:st.value,sub:ss.value,wa:sw.value.replace(/\\D/g,'')};save();init();shopAdmin()}
function couponAdmin(){ac.innerHTML=`<h3>Coupons</h3>`+db.coupons.map((c,i)=>`<div class="order"><b>${esc(c.code)}</b> — ${c.value}% <button class="red" onclick="db.coupons.splice(${i},1);save();couponAdmin()">Delete</button></div>`).join('')+`<div class="row"><input id="newc" placeholder="SAVE10"><input id="newv" type="number" placeholder="10"></div><br><button class="dark" onclick="db.coupons.push({code:newc.value.toUpperCase(),value:Number(newv.value)});save();couponAdmin()">Add Coupon</button>`}
function passAdmin(){ac.innerHTML='<h3>Change Admin Password</h3><input id="newp" type="password" placeholder="New password"><br><br><button class="dark" onclick="changePass()">Change Password</button>'}
function changePass(){if(newp.value.length<6)return alert('Minimum 6 characters');db.password=newp.value;save();alert('Password changed')}
init();setTimeout(adminStart,150);
</script></body></html>
