<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jishnu Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:white;padding:16px;position:sticky;top:0;z-index:5}
.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:22px}.muted{color:#667085}.hero{padding:28px 0}.hero h2{font-size:32px;margin:5px 0}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}.cat,.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.cat{background:white}.cat.active{background:#111827;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #0000000b}.pic{height:180px;background:#eef2f7;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:cover}.cardbody{padding:14px}.price{font-size:20px;font-weight:700;margin:8px 0}.btn{background:#111827;color:white}.btn.alt{background:#e8eefc;color:#172033}.cart{position:fixed;right:16px;bottom:16px;border:0;background:#111827;color:white;padding:14px 18px;border-radius:30px;box-shadow:0 8px 25px #0004;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;overflow:auto;padding:20px}.box{max-width:760px;margin:30px auto;background:white;border-radius:18px;padding:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d5d9e2;border-radius:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#dc2626!important}.adminbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.order{border:1px solid #e3e6eb;border-radius:12px;padding:12px;margin:10px 0}.small{font-size:13px}
@media(max-width:600px){.row{grid-template-columns:1fr}.hero h2{font-size:25px}}
</style>
</head>
<body>
<header><div class="wrap top"><h1 id="shopName">Jishnu Store</h1><button class="btn alt" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button></div></header>
<main class="wrap">
<section class="hero"><div class="muted">Local Delivery Store</div><h2 id="title">Everything You Need, Near You</h2><p id="sub">Quality products • Affordable prices • Local COD delivery</p>
<input id="search" class="search" placeholder="🔎 Search products..." oninput="render()"><div id="cats" class="cats"></div></section>
<div id="products" class="grid"></div>
</main>
<button class="cart" onclick="openCart()">🛒 View Cart</button>

<div id="cartModal" class="modal"><div class="box"><div class="adminbar"><h2>🛒 Your Cart</h2><button class="btn alt" onclick="closeModal('cartModal')">✕</button></div><div id="cartItems"></div><h3>Total: ₹<span id="total">0</span></h3>
<div id="checkout" style="display:none"><h3>COD Order</h3><div class="row"><div class="field"><label>Name</label><input id="cname"></div><div class="field"><label>Phone</label><input id="cphone"></div></div><div class="field"><label>Address</label><textarea id="caddress" rows="3"></textarea></div><button class="btn" onclick="placeOrder()">Place COD Order on WhatsApp</button></div></div></div>

<div id="adminModal" class="modal"><div class="box" id="adminBox"></div></div>
<script>
const KEY='jishnu_store_pro_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
settings:{name:'Jishnu Store',title:'Everything You Need, Near You',sub:'Quality products • Affordable prices • Local COD delivery',wa:'919999999999'},
password:'Jishnu@123',products:[
{id:1,name:'Premium Highlighter Set',price:99,cat:'Stationery',stock:20,img:''},
{id:2,name:'Study Pen Pack',price:129,cat:'Stationery',stock:30,img:''},
{id:3,name:'Mobile Charging Cable',price:199,cat:'Electronics',stock:15,img:''},
{id:4,name:'Water Bottle',price:249,cat:'Home',stock:12,img:''}],orders:[]};
let cart=[];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function init(){shopName.textContent=db.settings.name;title.textContent=db.settings.title;sub.textContent=db.settings.sub;render()}
function cats(){return ['All',...new Set(db.products.map(p=>p.cat).filter(Boolean))]}
function render(){
 let q=(search.value||'').toLowerCase(), active=document.querySelector('.cat.active')?.textContent||'All';
 catsEl=document.getElementById('cats'); catsEl.innerHTML=cats().map(c=>`<button class="cat ${c==active?'active':''}" onclick="filterCat('${esc(c)}')">${esc(c)}</button>`).join('');
 let ps=db.products.filter(p=>(active==='All'||p.cat===active)&&(!q||p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)));
 products.innerHTML=ps.map(p=>`<div class="card"><div class="pic">${p.img?`<img src="${p.img}">`:'🛍️'}</div><div class="cardbody"><div class="muted small">${esc(p.cat)}</div><h3>${esc(p.name)}</h3><div class="price">₹${p.price}</div><div class="small">${p.stock>0?'In stock':'Out of stock'}</div><br><button class="btn" ${p.stock<1?'disabled':''} onclick="add(${p.id})">Add to Cart</button></div></div>`).join('')||'<p>No products found.</p>';
 updateCount();
}
function filterCat(c){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));[...document.querySelectorAll('.cat')].find(x=>x.textContent===c)?.classList.add('active');render()}
function add(id){let p=db.products.find(x=>x.id===id), i=cart.find(x=>x.id===id);if(!p||p.stock<1)return;if(i)i.qty=Math.min(i.qty+1,p.stock);else cart.push({id,qty:1});updateCount()}
function updateCount(){count.textContent=cart.reduce((a,b)=>a+b.qty,0)}
function openCart(){renderCart();cartModal.style.display='block'}
function closeModal(id){document.getElementById(id).style.display='none'}
function renderCart(){let total=0;cartItems.innerHTML=cart.map(i=>{let p=db.products.find(x=>x.id===i.id);if(!p)return '';total+=p.price*i.qty;return `<div class="order"><b>${esc(p.name)}</b><br>₹${p.price} × ${i.qty}<div class="actions"><button class="btn alt" onclick="chg(${p.id},-1)">−</button><button class="btn alt" onclick="chg(${p.id},1)">+</button><button class="btn danger" onclick="removeItem(${p.id})">Remove</button></div></div>`}).join('')||'<p>Your cart is empty.</p>';document.getElementById('total').textContent=total;checkout.style.display=cart.length?'block':'none'}
function chg(id,n){let i=cart.find(x=>x.id===id),p=db.products.find(x=>x.id===id);if(!i)return;i.qty+=n;if(i.qty>p.stock)i.qty=p.stock;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart();updateCount()}
function removeItem(id){cart=cart.filter(x=>x.id!==id);renderCart();updateCount()}
function placeOrder(){
 let name=cname.value.trim(),phone=cphone.value.trim(),address=caddress.value.trim();if(!name||!phone||!address)return alert('Please fill all details.');
 let items=cart.map(i=>{let p=db.products.find(x=>x.id===i.id);return `${p.name} x${i.qty} = ₹${p.price*i.qty}`}).join('%0A'), total=cart.reduce((s,i)=>s+db.products.find(p=>p.id===i.id).price*i.qty,0);
 let msg=`New COD Order%0AName: ${encodeURIComponent(name)}%0APhone: ${encodeURIComponent(phone)}%0AAddress: ${encodeURIComponent(address)}%0A%0A${items}%0A%0ATotal: ₹${total}`;
 db.orders.unshift({id:Date.now(),name,phone,address,items:cart.map(i=>({id:i.id,qty:i.qty})),total,status:'New',date:new Date().toLocaleString()});
 save();window.open('https://wa.me/'+db.settings.wa+'?text='+msg,'_blank');cart=[];closeModal('cartModal');render();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function admin(){
 if(new URLSearchParams(location.search).get('admin')!=='1')return;
 let pass=prompt('Admin Password');if(pass!==db.password)return alert('Wrong password');
 showAdmin();
}
function showAdmin(){adminModal.style.display='block';drawAdmin()}
function drawAdmin(){
 adminBox.innerHTML=`<div class="adminbar"><h2>⚙️ Admin Dashboard</h2><button class="btn alt" onclick="closeModal('adminModal')">✕</button></div>
 <div class="actions"><button class="btn" onclick="adminProducts()">📦 Products</button><button class="btn" onclick="adminShop()">🏪 Shop Settings</button><button class="btn" onclick="adminOrders()">🧾 Orders (${db.orders.length})</button><button class="btn alt" onclick="changePass()">🔐 Change Password</button></div><hr><div id="adminContent"></div>`;
 adminProducts();
}
function adminProducts(){
 adminContent.innerHTML=`<div class="adminbar"><h3>Products</h3><button class="btn" onclick="editProduct()">＋ Add Product</button></div>`+
 db.products.map(p=>`<div class="order"><b>${esc(p.name)}</b> — ₹${p.price} — ${esc(p.cat)} — Stock ${p.stock}<div class="actions"><button class="btn alt" onclick="editProduct(${p.id})">Edit</button><button class="btn danger" onclick="delProduct(${p.id})">Delete</button></div></div>`).join('');
}
function editProduct(id){
 let p=db.products.find(x=>x.id===id)||{id:Date.now(),name:'',price:0,cat:'General',stock:1,img:''};
 adminContent.innerHTML=`<h3>${id?'Edit':'Add'} Product</h3><div class="field"><label>Name</label><input id="pn" value="${esc(p.name)}"></div><div class="row"><div class="field"><label>Price ₹</label><input id="pp" type="number" value="${p.price}"></div><div class="field"><label>Stock</label><input id="ps" type="number" value="${p.stock}"></div></div><div class="field"><label>Category</label><input id="pc" value="${esc(p.cat)}" placeholder="e.g. Grocery, Fashion, Electronics"></div><div class="field"><label>Product Photo</label><input id="pi" type="file" accept="image/*" onchange="previewImg(this)"><div id="prev">${p.img?`<img src="${p.img}" style="max-width:140px;margin-top:8px;border-radius:10px">`:''}</div></div><div class="actions"><button class="btn" onclick="saveProduct(${id||0})">Save Product</button><button class="btn alt" onclick="adminProducts()">Cancel</button></div>`;
 window.currentImg=p.img||'';
}
function previewImg(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{window.currentImg=r.result;prev.innerHTML=`<img src="${r.result}" style="max-width:140px;margin-top:8px;border-radius:10px">`};r.readAsDataURL(f)}
function saveProduct(id){
 let p={id:id||Date.now(),name:pn.value.trim(),price:Number(pp.value),cat:pc.value.trim()||'General',stock:Number(ps.value),img:window.currentImg||''};
 if(!p.name)return alert('Product name required');let old=db.products.findIndex(x=>x.id===p.id);if(old>=0)db.products[old]=p;else db.products.unshift(p);save();render();adminProducts()
}
function delProduct(id){if(confirm('Delete this product?')){db.products=db.products.filter(p=>p.id!==id);save();render();adminProducts()}}
function adminShop(){adminContent.innerHTML=`<h3>Shop Settings</h3><div class="field"><label>Shop Name</label><input id="sn" value="${esc(db.settings.name)}"></div><div class="field"><label>Heading</label><input id="st" value="${esc(db.settings.title)}"></div><div class="field"><label>Description</label><input id="ss" value="${esc(db.settings.sub)}"></div><div class="field"><label>WhatsApp Number (country code)</label><input id="sw" value="${esc(db.settings.wa)}"></div><button class="btn" onclick="saveShop()">Save Settings</button>`}
function saveShop(){db.settings={name:sn.value.trim()||'Jishnu Store',title:st.value.trim(),sub:ss.value.trim(),wa:sw.value.replace(/\D/g,'')};save();init();alert('Saved');adminShop()}
function adminOrders(){adminContent.innerHTML='<h3>Orders</h3>'+ (db.orders.map(o=>`<div class="order"><b>Order #${o.id}</b><br>${esc(o.name)} • ${esc(o.phone)}<br>${esc(o.address)}<br>Total: ₹${o.total}<br><span class="small">${o.date}</span><br><select onchange="statusOrder(${o.id},this.value)"><option ${o.status==='New'?'selected':''}>New</option><option ${o.status==='Packed'?'selected':''}>Packed</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option></select></div>`).join('')||'<p>No orders yet.</p>')}
function statusOrder(id,s){let o=db.orders.find(x=>x.id===id);if(o){o.status=s;save()}}
function changePass(){let p=prompt('New admin password (minimum 6 characters)');if(p&&p.length>=6){db.password=p;save();alert('Password changed')}else if(p)alert('Password must be at least 6 characters')}
init();setTimeout(admin,100);
</script>
</body></html>
